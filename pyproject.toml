[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lotr-transformer"
version = "0.1.0"
description = "Decoder-only Transformer trained on LOTR tokens"
authors = [{name="Your Name"}]
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "spacy>=3.7",
  "unidecode>=1.3",
  "tqdm>=4.66",
  "pyyaml>=6.0.1",
  "typer>=0.12.3",
]

[tool.ruff]
line-length = 100
select = ["E","F","I","B"]
